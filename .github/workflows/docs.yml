name: Docs

on:
  push:
    branches: [main, master]
    paths:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "participants/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "participants/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/ISSUE_TEMPLATE/**"

jobs:
  presence:
    name: Fichiers open source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Vérifier la présence des documents de base
        run: |
          test -f README.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -f SECURITY.md
          test -f docs/guide.md
